<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <main>
    <div class="card">
      <div class="card__images">
        <picture>
          <source media="(min-width: 750px)" srcset="images/image-product-desktop.jpg">
          <img src="images/image-product-mobile.jpg" alt="perfume photo" class="card__image">
        </picture>
      </div>
      
      <div class="card__content">
        <h2 class="card__subtitle">
          Perfume
        </h2>
        <h1 class="card__title">
          Gabrielle Essence Eau De Parfum
        </h1>
        <p class="card__desc">
          A floral, solar and voluptuous interpretation composed by Olivier Polge, 
          Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="card__price">
          <strong class="card__price-new">$149.99</strong>
          <s class="card__price-old">$169.99</s>
        </div>
        <button class="card__btn">
          <img src="images/icon-cart.svg" alt="cart" class="card__btn-icon">
          Add to Cart
        </button>
      </div>

    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">@IIIRNBY</a>.
  </footer>
</body>
</html>
